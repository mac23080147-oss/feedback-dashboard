<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin View — Feedback Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="nav-container"></div>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-semibold text-gray-800 mb-6">Admin View</h1>

    <div class="mb-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-4">
        <p class="text-sm text-gray-500">Total feedback</p>
        <p id="summary-total" class="text-2xl font-semibold text-gray-800 mt-1"></p>
      </div>
      <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-4">
        <p class="text-sm text-gray-500">Average rating</p>
        <p id="summary-average" class="text-2xl font-semibold text-gray-800 mt-1"></p>
      </div>
      <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-4">
        <p class="text-sm text-gray-500">Most common location</p>
        <p id="summary-location" class="text-2xl font-semibold text-gray-800 mt-1"></p>
      </div>
    </div>

    <div class="mb-6 bg-white rounded-lg border border-gray-200 shadow-sm p-4">
      <p class="text-sm font-medium text-gray-700 mb-2">Rating distribution</p>
      <p id="rating-chart-empty" class="text-sm text-gray-500 hidden">No feedback yet</p>
      <canvas id="rating-chart" height="120"></canvas>
    </div>

    <div class="mb-4 flex flex-wrap items-end gap-4">
      <div>
        <label for="filter-location" class="block text-sm font-medium text-gray-700 mb-1">Location</label>
        <select id="filter-location"
          class="rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">All locations</option>
          <option value="District 1">District 1</option>
          <option value="District 3">District 3</option>
          <option value="Thao Dien">Thao Dien</option>
        </select>
      </div>

      <div>
        <label for="filter-min-rating" class="block text-sm font-medium text-gray-700 mb-1">Minimum rating</label>
        <select id="filter-min-rating"
          class="rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>

      <div>
        <label for="filter-from" class="block text-sm font-medium text-gray-700 mb-1">From</label>
        <input type="date" id="filter-from"
          class="rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label for="filter-to" class="block text-sm font-medium text-gray-700 mb-1">To</label>
        <input type="date" id="filter-to"
          class="rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label for="filter-search-comment" class="block text-sm font-medium text-gray-700 mb-1">Search comment</label>
        <input type="text" id="filter-search-comment" placeholder="Search comment"
          class="rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div class="flex items-center gap-2">
        <input type="checkbox" id="filter-show-hidden"
          class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <label for="filter-show-hidden" class="text-sm font-medium text-gray-700">Show hidden</label>
      </div>
    </div>

    <div class="mb-2 flex items-center justify-between gap-4">
      <p id="feedback-count" class="text-sm text-gray-500"></p>
      <button id="export-csv-btn" type="button"
        class="rounded-md bg-gray-700 px-3 py-1.5 text-sm font-medium text-white hover:bg-gray-800">
        Export CSV
      </button>
    </div>

    <div id="feedback-table-container"></div>
  </main>

  <script src="../shared/nav.js"></script>
  <script>
  if (typeof renderNav === 'function') {
    renderNav('admin');
  }

  let allEntries = [];
  let ratingChart = null;

  function normalizeDate(value) {
    if (!value) return new Date();

    // Firestore timestamp object from API
    if (value._seconds) {
      return new Date(value._seconds * 1000);
    }

    // normal ISO string fallback
    return new Date(value);
  }

  function formatDate(value) {
    const d = normalizeDate(value);
    const pad = (n) => String(n).padStart(2, '0');

    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function toLocalDateInputValue(value) {
    const d = normalizeDate(value);
    const pad = (n) => String(n).padStart(2, '0');

    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function getSentimentClass(rating) {
    const r = Number(rating);
    if (r <= 2) return 'bg-red-100';
    if (r === 3) return 'bg-yellow-100';
    return 'bg-green-100';
  }

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value == null ? '' : String(value);
    return div.innerHTML;
  }

  function tsvField(value) {
    const str = value == null ? '' : String(value);
    const escaped = str.replace(/"/g, '""');
    return /[\t\r\n"]/.test(str) ? `"${escaped}"` : escaped;
  }

  function encodeUtf16Le(str) {
    const bytes = new Uint8Array(str.length * 2);

    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      bytes[i * 2] = code & 0xff;
      bytes[i * 2 + 1] = code >> 8;
    }

    return bytes;
  }

  function downloadCsv(content, filename) {
    const bytes = encodeUtf16Le('\uFEFF' + content);
    const blob = new Blob([bytes], { type: 'text/csv;charset=utf-16le' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    URL.revokeObjectURL(url);
  }

  function buildCsv(entries) {
    const header = ['Date', 'Location', 'Rating', 'Name', 'Comment'].join('\t');

    const rows = entries.map((entry) =>
      [
        formatDate(entry.createdAt),
        entry.location,
        entry.rating,
        entry.name,
        entry.comment,
      ].map(tsvField).join('\t')
    );

    return [header, ...rows].join('\r\n');
  }

  async function loadEntries() {
    try {
      const response = await fetch('/api/feedback');
      const data = await response.json();

      if (!data.success) {
        console.error(data.error);
        return [];
      }

      return data.feedbacks || [];
    } catch (error) {
      console.error(error);
      return [];
    }
  }

  function applyFilters(entries) {
    const location = document.getElementById('filter-location').value;
    const minRating = Number(document.getElementById('filter-min-rating').value);
    const from = document.getElementById('filter-from').value;
    const to = document.getElementById('filter-to').value;
    const searchComment = document.getElementById('filter-search-comment').value.trim().toLowerCase();

    return entries.filter((entry) => {
      if (location && entry.location !== location) return false;
      if (Number(entry.rating) < minRating) return false;

      const entryDate = toLocalDateInputValue(entry.createdAt);

      if (from && entryDate < from) return false;
      if (to && entryDate > to) return false;

      if (searchComment && !String(entry.comment ?? '').toLowerCase().includes(searchComment)) {
        return false;
      }

      return true;
    });
  }

  function renderSummary() {
    const entries = allEntries;

    const totalEl = document.getElementById('summary-total');
    const averageEl = document.getElementById('summary-average');
    const locationEl = document.getElementById('summary-location');

    totalEl.textContent = String(entries.length);

    if (entries.length === 0) {
      averageEl.textContent = 'N/A';
      locationEl.textContent = 'N/A';
      return;
    }

    const averageRating = entries.reduce((sum, entry) => sum + Number(entry.rating), 0) / entries.length;
    averageEl.textContent = averageRating.toFixed(1);

    const locationCounts = {};

    entries.forEach((entry) => {
      locationCounts[entry.location] = (locationCounts[entry.location] || 0) + 1;
    });

    const locations = Object.keys(locationCounts);

    const mostCommonLocation = locations.reduce(
      (best, location) => locationCounts[location] > locationCounts[best] ? location : best,
      locations[0]
    );

    locationEl.textContent = mostCommonLocation;
  }

  function renderChart() {
    const entries = allEntries;

    const canvas = document.getElementById('rating-chart');
    const emptyEl = document.getElementById('rating-chart-empty');

    const counts = [1, 2, 3, 4, 5].map(
      (rating) => entries.filter((entry) => Number(entry.rating) === rating).length
    );

    if (entries.length === 0) {
      emptyEl.classList.remove('hidden');
      canvas.classList.add('hidden');

      if (ratingChart) {
        ratingChart.destroy();
        ratingChart = null;
      }

      return;
    }

    emptyEl.classList.add('hidden');
    canvas.classList.remove('hidden');

    if (ratingChart) {
      ratingChart.data.datasets[0].data = counts;
      ratingChart.update();
      return;
    }

    ratingChart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: ['1', '2', '3', '4', '5'],
        datasets: [{
          label: 'Number of feedback entries',
          data: counts,
          backgroundColor: ['#fca5a5', '#fca5a5', '#fde047', '#86efac', '#86efac'],
        }],
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              precision: 0
            }
          }
        },
        plugins: {
          legend: {
            display: false
          }
        },
      },
    });
  }

  function renderFeedback() {
    renderSummary();
    renderChart();

    const countEl = document.getElementById('feedback-count');
    const container = document.getElementById('feedback-table-container');

    if (allEntries.length === 0) {
      countEl.textContent = '';
      container.innerHTML = '<p class="text-sm text-gray-500">No feedback yet</p>';
      return;
    }

    const filtered = applyFilters(allEntries);

    countEl.textContent = `Showing ${filtered.length} of ${allEntries.length} feedbacks`;

    if (filtered.length === 0) {
      container.innerHTML = '<p class="text-sm text-gray-500">No feedback matches your filters</p>';
      return;
    }

    const sorted = [...filtered].sort(
      (a, b) => normalizeDate(b.createdAt) - normalizeDate(a.createdAt)
    );

    const rows = sorted.map((entry) => {
      return `
        <tr class="border-b border-gray-200 ${getSentimentClass(entry.rating)}">
          <td class="px-4 py-2 text-sm text-gray-700 whitespace-nowrap">${formatDate(entry.createdAt)}</td>
          <td class="px-4 py-2 text-sm text-gray-700 whitespace-nowrap">${escapeHtml(entry.location)}</td>
          <td class="px-4 py-2 text-sm text-gray-700">${escapeHtml(entry.rating)}</td>
          <td class="px-4 py-2 text-sm text-gray-700 whitespace-nowrap">${escapeHtml(entry.name || 'Anonymous')}</td>
          <td class="px-4 py-2 text-sm text-gray-700">${escapeHtml(entry.comment)}</td>
        </tr>
      `;
    }).join('');

    container.innerHTML = `
      <div class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200 text-left">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-2 text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
              <th class="px-4 py-2 text-xs font-medium text-gray-500 uppercase tracking-wider">Location</th>
              <th class="px-4 py-2 text-xs font-medium text-gray-500 uppercase tracking-wider">Rating</th>
              <th class="px-4 py-2 text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
              <th class="px-4 py-2 text-xs font-medium text-gray-500 uppercase tracking-wider">Comment</th>
            </tr>
          </thead>

          <tbody class="divide-y divide-gray-200">
            ${rows}
          </tbody>
        </table>
      </div>
    `;
  }

  async function initDashboard() {
    const container = document.getElementById('feedback-table-container');
    container.innerHTML = '<p class="text-sm text-gray-500">Loading feedback...</p>';

    allEntries = await loadEntries();

    renderFeedback();
  }

  ['filter-location', 'filter-min-rating', 'filter-from', 'filter-to', 'filter-show-hidden'].forEach((id) => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('change', renderFeedback);
    }
  });

  document.getElementById('filter-search-comment').addEventListener('input', renderFeedback);

  document.getElementById('export-csv-btn').addEventListener('click', () => {
    const filtered = applyFilters(allEntries);

    if (filtered.length === 0) {
      alert('Nothing to export');
      return;
    }

    const sorted = [...filtered].sort(
      (a, b) => normalizeDate(b.createdAt) - normalizeDate(a.createdAt)
    );

    downloadCsv(buildCsv(sorted), `feedback-export-${toLocalDateInputValue(new Date())}.csv`);
  });

  initDashboard();
</script>
</body>
</html>
