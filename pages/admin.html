<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin View — Feedback Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="nav-container"></div>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-semibold text-gray-800 mb-6">Admin View</h1>

    <div class="mb-4 flex flex-wrap items-end gap-4">
      <div>
        <label for="filter-location" class="block text-sm font-medium text-gray-700 mb-1">Location</label>
        <select id="filter-location"
          class="rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">All locations</option>
          <option value="District 1">District 1</option>
          <option value="District 3">District 3</option>
          <option value="Thao Dien">Thao Dien</option>
        </select>
      </div>

      <div>
        <label for="filter-min-rating" class="block text-sm font-medium text-gray-700 mb-1">Minimum rating</label>
        <select id="filter-min-rating"
          class="rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>

      <div>
        <label for="filter-from" class="block text-sm font-medium text-gray-700 mb-1">From</label>
        <input type="date" id="filter-from"
          class="rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label for="filter-to" class="block text-sm font-medium text-gray-700 mb-1">To</label>
        <input type="date" id="filter-to"
          class="rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
    </div>

    <div class="mb-2 flex items-center justify-between gap-4">
      <p id="feedback-count" class="text-sm text-gray-500"></p>
      <button id="export-csv-btn" type="button"
        class="rounded-md bg-gray-700 px-3 py-1.5 text-sm font-medium text-white hover:bg-gray-800">
        Export CSV
      </button>
    </div>

    <div id="feedback-table-container"></div>
  </main>

  <script src="../shared/nav.js"></script>
  <script>
    renderNav('admin');

    function formatDate(isoString) {
      const d = new Date(isoString);
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function toLocalDateInputValue(isoString) {
      const d = new Date(isoString);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function getSentimentClass(rating) {
      const r = Number(rating);
      if (r <= 2) return 'bg-red-100';
      if (r === 3) return 'bg-yellow-100';
      return 'bg-green-100';
    }

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = value == null ? '' : String(value);
      return div.innerHTML;
    }

    function tsvField(value) {
      const str = value == null ? '' : String(value);
      const escaped = str.replace(/"/g, '""');
      return /[\t\r\n"]/.test(str) ? `"${escaped}"` : escaped;
    }

    function buildCsv(entries) {
      const header = ['Date', 'Location', 'Rating', 'Name', 'Comment'].join('\t');
      const rows = entries.map((entry) =>
        [
          formatDate(entry.timestamp),
          entry.location,
          entry.rating,
          entry.name,
          entry.comment,
        ].map(tsvField).join('\t')
      );
      return [header, ...rows].join('\r\n');
    }

    function encodeUtf16Le(str) {
      const bytes = new Uint8Array(str.length * 2);
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i);
        bytes[i * 2] = code & 0xff;
        bytes[i * 2 + 1] = code >> 8;
      }
      return bytes;
    }

    function downloadCsv(content, filename) {
      const bytes = encodeUtf16Le('\uFEFF' + content);
      const blob = new Blob([bytes], { type: 'text/csv;charset=utf-16le' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function loadEntries() {
      try {
        const parsed = JSON.parse(localStorage.getItem('feedbackEntries') || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function applyFilters(entries) {
      const location = document.getElementById('filter-location').value;
      const minRating = Number(document.getElementById('filter-min-rating').value);
      const from = document.getElementById('filter-from').value;
      const to = document.getElementById('filter-to').value;

      return entries.filter((entry) => {
        if (location && entry.location !== location) return false;
        if (Number(entry.rating) < minRating) return false;

        const entryDate = toLocalDateInputValue(entry.timestamp);
        if (from && entryDate < from) return false;
        if (to && entryDate > to) return false;

        return true;
      });
    }

    let editingTimestamp = null;

    function renderFeedback() {
      const countEl = document.getElementById('feedback-count');
      const container = document.getElementById('feedback-table-container');
      const entries = loadEntries();

      if (entries.length === 0) {
        countEl.textContent = '';
        container.innerHTML = '<p class="text-sm text-gray-500">No feedback yet</p>';
        return;
      }

      const filtered = applyFilters(entries);
      countEl.textContent = `Showing ${filtered.length} of ${entries.length} feedbacks`;

      if (filtered.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-500">No feedback matches your filters</p>';
        return;
      }

      const sorted = [...filtered].sort(
        (a, b) => new Date(b.timestamp) - new Date(a.timestamp)
      );

      const rows = sorted
        .map((entry) => {
          if (entry.timestamp === editingTimestamp) {
            return `
              <tr class="border-b border-gray-200 ${getSentimentClass(entry.rating)}">
                <td class="px-4 py-2 text-sm text-gray-700 whitespace-nowrap">${formatDate(entry.timestamp)}</td>
                <td class="px-4 py-2 text-sm text-gray-700">
                  <select class="edit-location rounded-md border border-gray-300 px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="District 1" ${entry.location === 'District 1' ? 'selected' : ''}>District 1</option>
                    <option value="District 3" ${entry.location === 'District 3' ? 'selected' : ''}>District 3</option>
                    <option value="Thao Dien" ${entry.location === 'Thao Dien' ? 'selected' : ''}>Thao Dien</option>
                  </select>
                </td>
                <td class="px-4 py-2 text-sm text-gray-700">
                  <select class="edit-rating rounded-md border border-gray-300 px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    ${[1, 2, 3, 4, 5].map((value) => `<option value="${value}" ${Number(entry.rating) === value ? 'selected' : ''}>${value}</option>`).join('')}
                  </select>
                </td>
                <td class="px-4 py-2 text-sm text-gray-700">
                  <input type="text" class="edit-name w-full rounded-md border border-gray-300 px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value="${escapeHtml(entry.name)}" />
                </td>
                <td class="px-4 py-2 text-sm text-gray-700">
                  <textarea class="edit-comment w-full rounded-md border border-gray-300 px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" rows="2">${escapeHtml(entry.comment)}</textarea>
                </td>
                <td class="px-4 py-2 text-sm whitespace-nowrap">
                  <button data-action="save" data-timestamp="${entry.timestamp}" class="text-green-600 hover:text-green-800 font-medium mr-2">Save</button>
                  <button data-action="cancel" data-timestamp="${entry.timestamp}" class="text-gray-600 hover:text-gray-800 font-medium">Cancel</button>
                </td>
              </tr>
            `;
          }

          return `
            <tr class="border-b border-gray-200 ${getSentimentClass(entry.rating)}">
              <td class="px-4 py-2 text-sm text-gray-700 whitespace-nowrap">${formatDate(entry.timestamp)}</td>
              <td class="px-4 py-2 text-sm text-gray-700 whitespace-nowrap">${escapeHtml(entry.location)}</td>
              <td class="px-4 py-2 text-sm text-gray-700">${escapeHtml(entry.rating)}</td>
              <td class="px-4 py-2 text-sm text-gray-700 whitespace-nowrap">${escapeHtml(entry.name)}</td>
              <td class="px-4 py-2 text-sm text-gray-700">${escapeHtml(entry.comment)}</td>
              <td class="px-4 py-2 text-sm whitespace-nowrap">
                <button data-action="edit" data-timestamp="${entry.timestamp}" class="text-blue-600 hover:text-blue-800 font-medium mr-2">Edit</button>
                <button data-action="delete" data-timestamp="${entry.timestamp}" class="text-red-600 hover:text-red-800 font-medium">Delete</button>
              </td>
            </tr>
          `;
        })
        .join('');

      container.innerHTML = `
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200 text-left">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-4 py-2 text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                <th class="px-4 py-2 text-xs font-medium text-gray-500 uppercase tracking-wider">Location</th>
                <th class="px-4 py-2 text-xs font-medium text-gray-500 uppercase tracking-wider">Rating</th>
                <th class="px-4 py-2 text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                <th class="px-4 py-2 text-xs font-medium text-gray-500 uppercase tracking-wider">Comment</th>
                <th class="px-4 py-2 text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
              ${rows}
            </tbody>
          </table>
        </div>
      `;
    }

    function handleTableClick(event) {
      const button = event.target.closest('button[data-action]');
      if (!button) return;

      const action = button.dataset.action;
      const timestamp = button.dataset.timestamp;

      if (action === 'edit') {
        editingTimestamp = timestamp;
        renderFeedback();
      } else if (action === 'cancel') {
        editingTimestamp = null;
        renderFeedback();
      } else if (action === 'delete') {
        if (!confirm('Delete this feedback entry?')) return;
        const entries = loadEntries().filter((entry) => entry.timestamp !== timestamp);
        localStorage.setItem('feedbackEntries', JSON.stringify(entries));
        renderFeedback();
      } else if (action === 'save') {
        const row = button.closest('tr');
        const name = row.querySelector('.edit-name').value.trim();
        const location = row.querySelector('.edit-location').value;
        const rating = Number(row.querySelector('.edit-rating').value);
        const comment = row.querySelector('.edit-comment').value.trim();

        if (!comment) {
          alert('Comment is required.');
          return;
        }

        const entries = loadEntries().map((entry) =>
          entry.timestamp === timestamp ? { ...entry, name, location, rating, comment } : entry
        );
        localStorage.setItem('feedbackEntries', JSON.stringify(entries));
        editingTimestamp = null;
        renderFeedback();
      }
    }

    document.getElementById('feedback-table-container').addEventListener('click', handleTableClick);

    ['filter-location', 'filter-min-rating', 'filter-from', 'filter-to'].forEach((id) => {
      document.getElementById(id).addEventListener('change', renderFeedback);
    });

    document.getElementById('export-csv-btn').addEventListener('click', () => {
      const filtered = applyFilters(loadEntries());

      if (filtered.length === 0) {
        alert('Nothing to export');
        return;
      }

      const sorted = [...filtered].sort(
        (a, b) => new Date(b.timestamp) - new Date(a.timestamp)
      );

      downloadCsv(buildCsv(sorted), `feedback-export-${toLocalDateInputValue(new Date())}.csv`);
    });

    renderFeedback();
  </script>
</body>
</html>
